<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>合成大肥鱼</title>
    <link rel="icon" type="image/webp" href="Assets/processed/DeepSeek.webp?v=2" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">
          <img class="brand-icon" src="Assets/processed/DeepSeek.webp?v=2" alt="" />
        </div>
        <div class="brand-copy">
          <h1>合成大肥鱼</h1>
        </div>
      </header>

      <div class="game-layout">
        <section class="play-column" aria-labelledby="play-title">
          <div class="section-heading">
            <div>
              <h2 id="play-title">合成</h2>
            </div>
          </div>

          <div class="board-frame">
            <canvas id="game" width="420" height="620" tabindex="0" role="img"
              aria-label="合成大肥鱼游戏区域。选择位置放下角色，合并相同角色。">
              你的浏览器不支持画布游戏，请换一个较新的浏览器。
            </canvas>
            <div id="game-toast" class="game-toast" aria-live="polite" hidden></div>
          </div>

          <div class="play-footer">
            <p>
              <span class="desktop-instructions">选择位置放置；每 0.6 秒可放下一个，相同角色会自动合成。</span>
              <span class="touch-instructions" id="touch-instructions" aria-live="polite">拖动选位，再轻触放置（每 0.6 秒一个）。</span>
            </p>
          </div>
        </section>

        <aside class="info-column" aria-label="游戏信息">
          <section class="score-strip" aria-label="分数">
            <div class="score-tile score-current">
              <span>本局积分</span>
              <strong id="score">0</strong>
            </div>
            <div class="score-tile">
              <span>最高纪录</span>
              <strong id="best-score">0</strong>
            </div>
          </section>

          <section class="next-card" aria-labelledby="next-title">
            <div class="card-heading">
              <div><h2 id="next-title">下一个角色</h2></div>
            </div>
            <div class="next-avatar-wrap">
              <img id="next-image" alt="" />
              <span id="next-rank" class="rank-stamp">01</span>
            </div>
            <div class="next-copy"><strong id="next-name">豆包</strong></div>
          </section>

          <section class="collection-card" aria-labelledby="collection-title">
            <div class="card-heading collection-heading">
              <div><h2 id="collection-title">角色图鉴</h2></div>
              <span id="collection-count" class="collection-count">0 / 11</span>
            </div>
            <ol id="collection-list" class="collection-list" aria-label="模型进化顺序"></ol>
          </section>

          <button class="restart-button" id="restart-button" type="button">
            <span aria-hidden="true">↻</span> 再开一局
          </button>
          <p class="keyboard-note">键盘：← → 移动，空格放下，R 重来</p>
        </aside>
      </div>

      <footer class="page-footer">
        <span>作者：DornGames <a class="author-handle" href="https://github.com/Koloyaaa" target="_blank" rel="noopener noreferrer">@LéoWEE</a></span>
        <nav class="footer-links" aria-label="相关链接">
          <a href="https://github.com/Koloyaaa/DaFeiYu" target="_blank" rel="noopener noreferrer">作品仓库</a>
        </nav>
      </footer>
      <section id="asset-loader" class="asset-loader" role="status" aria-live="polite" aria-label="游戏素材加载状态">
        <div class="asset-loader-card">
          <span class="asset-loader-spinner" aria-hidden="true"></span>
          <h2 id="asset-loading-title">正在加载图片</h2>
          <p id="asset-loading-message" class="asset-loading-message">请稍候…</p>
          <div class="asset-progress-track" role="progressbar" aria-label="角色图片加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="asset-progress" class="asset-progress"></span>
          </div>
          <p id="asset-loading-count" class="asset-loading-count">0%</p>
          <button id="asset-retry" class="primary-button asset-retry" type="button" hidden>重试加载</button>
        </div>
      </section>
      <div id="announcer" class="sr-only" aria-live="polite"></div>
      <dialog id="game-over-dialog" class="result-dialog" aria-labelledby="result-title">
        <h2 id="result-title">本局结束</h2>
        <img id="result-avatar" class="result-avatar" alt="" hidden />
        <p id="result-copy"></p>
        <div class="result-stats"><span>本局积分</span><strong id="result-score">0</strong></div>
        <button id="dialog-restart" class="primary-button" type="button">再开一局 <span aria-hidden="true">→</span></button>
      </dialog>
      <script src="Assets/processed/manifest.js"></script>
      <script src="game.js"></script>
    </main>
  </body>
</html>
